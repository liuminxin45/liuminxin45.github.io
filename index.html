<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="刘民心的个人主页。" />
    <meta name="theme-color" content="#fdfdfb" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="刘民心" />
    <meta property="og:description" content="刘民心的个人主页。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="刘民心" />
    <meta name="twitter:description" content="刘民心的个人主页。" />
    <title>刘民心｜个人主页</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var resolved = theme

          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }

          root.classList.remove('light', 'dark')
          root.classList.add(resolved)
          root.style.colorScheme = resolved

          var motionParam = new URLSearchParams(window.location.search).get('motion')
          if (motionParam === 'system' || motionParam === 'full' || motionParam === 'reduce') {
            if (motionParam === 'system') {
              localStorage.removeItem('motion')
            } else {
              localStorage.setItem('motion', motionParam)
            }
          }

          var storedMotion = localStorage.getItem('motion')
          root.classList.toggle('motion-full', storedMotion === 'full')
          root.classList.toggle('motion-reduce', storedMotion === 'reduce')
        } catch (error) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
